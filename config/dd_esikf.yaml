# =============================================================================
# DD-ESIKF (Project A) — Direction-Decoupled ESIKF configuration.
# Appended to any FAST-LIVO2 base config (e.g. avia.yaml) to enable the
# selective degeneracy-resilient fusion. All params default to OFF, so loading
# this file alongside the base config is the ONLY change needed to switch
# between B0 (standard ESIKF), B2 (mask only), B3 (mask + prior).
# =============================================================================
#
# To run a comparison sweep, set `enable: true` and vary `default_prior_info`:
#   B0:  enable: false                    (standard ESIKF, original behavior)
#   B2:  enable: true,  default_prior_info: 0.0    (mask only, no prior)
#   B3:  enable: true,  default_prior_info: 5.0    (mask + constant prior floor)
# (For a real IMU-driven prior instead of the constant floor, wire
#  dd_prior_src_ in LIVMapper.cpp to an IMUPreintegrationPrior instance —
#  see the note at the bottom of this file.)
# =============================================================================

dd_esikf:
  # Master switch. false => DD-ESIKF is a complete no-op, original ESIKF runs
  # untouched (guaranteed backward compatibility).
  # >>> ENABLED — Layer 1 (T1 fused mask) is a core theorem of the DRIM-ESIKF
  #     framework and must be on for T3/T5 to have a degenerate subspace to act on.
  enable: true

  # Degeneracy criterion (Definition 1 in theory.tex). A direction v_k is
  # degenerate iff  λ_k < tau_abs  OR  λ_k/λ_1 < tau_rel.
  #
  # These are TWO READINGS OF ONE THRESHOLD, not two switches. Both branches
  # are affine in λ_1, so the rule collapses to
  #     λ_k < τ_k,   τ_k = max(tau_abs, tau_rel·λ_1).
  # The SAME τ_k now drives both the degenerate/observable split
  # (deg_indices, Π_deg) and the mask (m_k = clip(λ_k/τ_k, 0, 1)) — before
  # 2026-09-24 the split used τ_k while the mask used tau_abs alone, so on real
  # data tau_abs never fired (λ_L spans 1.2e2…9.2e11, m_k ≡ 1, M = I) while
  # tau_rel fired on 100% of frames: the mean path was a no-op and the covariance
  # path was active, i.e. two different D sets in one probe result.
  # A larger value makes the mask more aggressive.
  tau_abs: 1.0
  tau_rel: 0.001

  # ---------------------------------------------------------------------------
  # §2.2 Whitened criterion (2026-09-24). When true the degeneracy criterion runs
  # on the WHITENED information
  #     W = S Λ_f S,   S = (P^-)^{1/2}   (P^- = the propagated 6×6 pose cov)
  # so w_k = sensor information / prior information, DIMENSIONLESS. The thresholds
  # are then tau_w_abs / tau_w_rel above (not tau_abs/tau_rel), and the whole
  # verdict is invariant under error reparametrization ξ → Tξ:
  #     W' = (P')^{1/2} Λ' (P')^{1/2}  ~  W   ⇒ spec, flags, rank, mask unchanged.
  # This removes the defect of the raw criterion, whose reference λ_1 is on real
  # Outdoor04 data a ROTATIONAL eigenvalue (the top eigenvector's position-block
  # norm has mean 0.057), so translational degeneracy was being decided by
  # rotational observability. Reproduced in research/test_whitened.cpp: with
  # translational λ = 5.0e7 and ONLY the rotational block ×100, the raw criterion's
  # translational flags flip [000] → [111]; the whitened one does not move.
  #
  # READ THIS BEFORE ENABLING. w_k ≪ 1 means "the sensor is SILENT", not "the
  # sensor is UNRELIABLE". On Outdoor04 (14763 logged frames, block-diagonal
  # reconstruction of the real spectra) the median is w_pos = 118.7 / w_rot = 267.6
  # — both far above tau_w_abs — so this switch makes the DD mask a no-op in
  # effect. The contrast is in the TRIGGER RATE, not the margin:
  #     whitened fires on   0.72% of frames   (deg_rank mean 0.009)
  #     raw      fires on 100.00% of frames   (deg_rank mean 1.813, tau_k sits
  #                                            above the translational median)
  # A degeneracy flag that is on every frame carries no information; that is the
  # defect this criterion fixes. It is the right criterion for a scene where the
  # LiDAR really carries no information (facing a wall, open sky, featureless
  # tunnel); it is the WRONG instrument for Outdoor04's failure mode, which is
  # weak-direction residual BIAS. Bias is the residual channel's job
  # (thm:residual, cor:tilt-resolution). The two channels compose; they are not
  # substitutes. Default false = raw criterion, i.e. unchanged behaviour.
  #
  # >>> tau_w_rel MUST STAY SMALL. With the real P^- (median w_1 = 2.6e19 — the
  #     top whitened direction is an overwhelmingly well-constrained one), the
  #     RELATIVE branch of tau_w = max(tau_w_abs, tau_w_rel·w_1) takes over the
  #     moment tau_w_rel exceeds ~1e-17, and the criterion stops being about
  #     silence at all:
  #         tau_w_rel = 0     -> fires on       0.13% of frames (absolute branch)
  #         tau_w_rel = 1e-9  -> fires on      97.0%
  #         tau_w_rel = 1e-6  -> fires on      99.3%
  #         tau_w_rel = 1e-3  -> fires on     100.0%   <-- the raw criterion again
  #     i.e. the scale-relative branch reintroduces exactly the defect (§2.1:
  #     a ratio threshold has no dimension) that whitening removed. On this bag
  #     the absolute branch is the meaningful one; a LIVE run (WHITEN_smoke_r1)
  #     confirms it: w_min ~ 3.0e5 with tau_w_rel = 1e-3 as shipped below gives a
  #     degenerate set on 100% of frames and deg_rank ~ 4 in whitened mode.
  whiten_enable: false
  # Dimensionless thresholds on w_k (units of prior information). Only used when
  # whiten_enable is true. tau_w_abs = 0.25 also becomes the prior-information
  # floor on the covariance path's degenerate block in this mode (it replaces
  # default_prior_info there), so the mean and covariance paths keep using ONE
  # quantity — the same discipline the single-threshold fix established.
  # >>> tau_w_rel SHIPS AT 0.0, and that is the verified setting, not a shrug.
  #     In whitened coordinates the relative branch reads "degenerate if the
  #     sensor's information is w_1/tau_w_rel times smaller than the BEST
  #     direction's" — but w_1 is dimensionless only in the sense that it is a
  #     ratio, and on real Outdoor04 it is 2.6e19 (median). A ratio to it is the
  #     same dimensionally-empty rule §2.1 removed from the raw criterion; the
  #     whitening does not repair it, because whitening fixes the UNITS, not the
  #     reference. Trigger rate on the live whitened run (WHITEN_smoke_r1):
  #         tau_w_rel = 0     -> fires on   0.13% of frames (absolute branch only)
  #         tau_w_rel = 1e-9  -> fires on  97.0%
  #         tau_w_rel = 1e-6  -> fires on  99.3%
  #         tau_w_rel = 1e-3  -> fires on 100.0%   (deg_rank ~ 4: the raw criterion
  #                                                again, in different clothes)
  #     Set it > 0 only when the relative branch is itself the object of study.
  tau_w_abs: 0.25
  tau_w_rel: 0.0

  # Mask shape (Proposition 5 / Assumption 1).
  # false (default) => continuous mask m_k = clip(λ_k/τ_k, 0, 1).
  # true             => hard 0/1 mask (stricter consistency guarantee, Corollary).
  hard_mask: false

  # Constant prior information floor injected along EVERY degenerate direction
  # (applied regardless of whether a PriorSource is wired).
  # 0.0  => pure masking (B2). The degenerate dir gets no information and its
  #        variance does not contract (Theorem 4 / Corollary).
  # >0   => const-information floor on degenerate dirs, applied whether or not
  #        a PriorSource is wired (assemblePrior no longer early-returns on a
  #        null source, so the mean and covariance paths use the same
  #        information). This is a ZERO-MEAN virtual observation: b_pr = 0, so
  #        it floors the covariance without pulling the mean. Useful for
  #        ablation without wiring a real IMU prior.
  # >>> ENABLED (5.0) — gives T1 a working prior floor so the degenerate dir is
  #     not left with zero information when T3 keeps its variance at the prior.
  default_prior_info: 5.0

  # Compute the mask ONCE per frame (before the ESIKF inner iteration loop) and
  # hold it constant across inner iterations. Required by Assumption 1
  # (iterate-independence) for Proposition 5 (convergence). KEEP TRUE.
  per_frame_mask: true

  # ---------------------------------------------------------------------------
  # P2 fused-mask (Theorem T1): probe degeneracy on Λ_f = Λ_L + Λ_V instead of
  # Λ_L only. The visual information matrix Λ_V is the 6×6 pose block cached by
  # VIOManager::updateState from the most recent VIO frame (one frame stale
  # w.r.t. the LIO step). Because visual info can only SHRINK the degenerate
  # subspace (V_deg(Λ_f) ⊆ V_deg(Λ_L)), this minimizes prior injection and
  # reliance on the prior. The mask is still applied to Λ_L only — VIO keeps its
  # own ESIKF. No separate switch: loading dd_esikf.yaml + VIO caching the block
  # is enough; set this false to force Λ_L-only probing even when Λ_V exists.
  fused_mask: true

  # ---------------------------------------------------------------------------
  # Layer 2 (Theorem T2): NIS-based adaptive LiDAR measurement noise.
  # Maintains an EMA rho of the per-frame residual NIS; a healthy (observable)
  # LiDAR has rho→1 and phi→1 (no-op, original behaviour). Under LiDAR
  # degeneracy / failure rho grows, phi grows, R is inflated => the LiDAR
  # contributes less information (doubly suppressed with the directional mask).
  adaptive_enable: true
  adaptive_alpha: 0.05        # EMA forgetting factor (small => slow adaptation)
  adaptive_phi_min: 1.0       # R scaling floor (never shrink R below nominal)
  adaptive_phi_max: 10.0      # R scaling ceiling (avoid unbounded inflation)
  adaptive_ramp_thr: 1.5      # rho above which phi starts ramping up

  # ---------------------------------------------------------------------------
  # Layer 6 (Theorem T6): range-dependent anisotropic LiDAR measurement noise.
  # For long-range points the depth (beam) variance grows ~range^2 but is
  # largely discarded when projected onto the plane normal. We recover the
  # distance information by inflating R (shrinking R_inv) for far points,
  # so the degenerate depth direction is down-weighted and degeneracy
  # detection is sharper. Saturates at far_scale. No-op when enable is false.
  aniso_enable: true
  aniso_far_range: 30.0     # range [m] beyond which R starts inflating
  aniso_far_scale: 3.0      # max multiplicative inflation of R

  # ---------------------------------------------------------------------------
  # Layer 4 (Theorem T4): first-estimate Jacobian (FEJ) mode. When true, the
  # 6×6 pose-block information matrix Λ_L and the observation-info vector
  # H^T R^-1 z are frozen at the FIRST inner iteration's linearization point
  # and reused every subsequent inner iteration. This removes the fictitious-
  # observability leak (F5): a re-linearizing ESIKF lets small eigenvalues
  # drift as H shifts iteration to iteration, injecting spurious information
  # into weakly-observable directions. FEJ holds the linearization fixed so
  # the information added per direction is consistent with the first-estimate
  # geometry. Composes with DD-ESIKF (the mask then operates on the frozen
  # Λ_L). No-op when false (standard re-linearizing ESIKF).
  # >>> ENABLED — T4 is the theory highlight (first-estimate Jacobian): freezes
  #     the 6×6 pose information at the first inner iteration to remove the
  #     fictitious-observability leak (F5). Composes with T1 (mask on frozen Λ_L).
  fej_enable: true

  # ---------------------------------------------------------------------------
  # RR-IESKF Axis I (theory.tex eq:dfej / lem:dfej): directional FEJ (DFEJ).
  # Requires dd_esikf/enable: true. Freezes the pose information block ONLY on
  # the degenerate subspace Π_deg and re-linearizes on the observable
  # complement Π_obs at every inner iteration:
  #   Λ_eff^(i) = Π_obs Λ^(i) Π_obs + Π_deg Λ_eff^(0) Π_deg
  # (D1) on D this equals whole-frame FEJ — the fictitious-observability leak
  #      stays blocked (the frozen D-block cannot drift as H re-linearizes);
  # (D2) on O the fresh re-linearized H^(i) keeps first-order Fisher
  #      optimality across inner iterations, which whole-frame FEJ sacrifices;
  # (D3) DFEJ is no-worse-than FEJ pointwise.
  # The O→D cross-covariance leak (rem:dfej-leak) is severed by the thm:main
  # P4 covariance projection, which runs in the same update. When BOTH
  # fej_enable and dfej_enable are true, DFEJ takes precedence: the O-block
  # stays fresh while the D-block is frozen by the DD cache.
  dfej_enable: true

  # ---------------------------------------------------------------------------
  # RR-IESKF freeze threshold (theory.tex thm:residual / cor:tilt-resolution).
  # 0.0 => legacy absolute criterion (λ_min < lio/min_eigen_value).
  # >0   => scale-relative tilt criterion: accept a plane iff
  #         λ_min/λ_mid < tilt_tau². This is the θ²_tilt of the theory: a
  #         TILT threshold, not an information threshold — it decides whether
  #         the residual structure exceeds the map's own plane-fit precision
  #         (θ²_tilt = ⟨λ_min/λ_mid⟩_w ~ σ_pt/(L·√w)) rather than whether the
  #         information is numerically small (rem:which-floor).
  tilt_tau: 0.0

  # ---------------------------------------------------------------------------
  # RR-IESKF external anchor (theory.tex sec:common-mode, prop:common-mode
  # M4 / eq:anchor-att). The ONLY in-model defense against a steady
  # common-mode (extrinsic) bias: a full-rank pseudo-observation with
  # information anchor_lambda on ALL pose directions (not only the degenerate
  # subspace — the common mode lives everywhere), attenuating the absorbed
  # bias by exactly (λ_L+λ_V)/(λ_L+λ_V+λ_A). anchor_obs is the anchor
  # residual in pose-error units (0 = pull toward the propagated pose, i.e.
  # a motion-prior anchor). Sizing (M4): to hold the common-mode bias below
  # ε needs anchor_lambda ≥ (λ_L+λ_V)(1/ε − 1). No-op when lambda = 0.
  anchor_enable: false
  anchor_lambda: 0.0
  anchor_obs: 0.0

  # ---------------------------------------------------------------------------
  # Map-write gating (anti-pollution). Breaks the pollution feedback loop
  # (bad pose -> bad points written -> bad residual -> worse pose) at the
  # WRITE step: a point whose converged plane residual exceeds
  # map_gate_residual (m) is refused from the voxel map — polluted voxels
  # cannot be repaired by filtering, only starved. When the frame probe
  # reports degeneracy, surviving writes are additionally thinned by stride
  # (1 + deg_rank * map_gate_deg_thin) so a drifting segment contaminates the
  # map at a lower rate. No-op when map_gate_enable: false.
  map_gate_enable: true
  map_gate_residual: 0.20
  map_gate_deg_thin: 1

  # ---------------------------------------------------------------------------
  # Alternating DD sweeps (theory.tex prop:comp-iterate). One LIO pass per
  # frame is the k=1 truncation of block Gauss-Newton on the joint MAP cost;
  # under COUPLED degeneracy (probe degenerate + visual Λ_V present) the
  # single-sweep DD substitution leaves an O(||e_L||) re-linearization gap on
  # the frozen directions. When comp_sweep_enable is true and the probe is
  # degenerate, the inner ESIKF loop re-runs from the just-updated posterior
  # (fresh probe + fresh DD substitution at the new linearization point), up
  # to comp_sweep_max passes, stopping early once the pose correction falls
  # below comp_sweep_tol — recovering the joint fixed point. Sweeps > 1 never
  # fire on healthy frames, so the common path keeps the k=1 cost.
  comp_sweep_enable: false
  comp_sweep_max: 2
  comp_sweep_tol: 0.001

  # ---------------------------------------------------------------------------
  # Submap management, stage 1 (anti-pollution). The unbounded global voxel
  # map is the reservoir of map pollution: nothing ever leaves it, so a drift
  # episode keeps contaminating matching far into the trajectory. With
  # submap_enable: true, each root voxel is tagged with the last frame that
  # touched it, and every submap_period frames the maintenance pass evicts
  # voxels that are BOTH idle for > submap_evict_stale frames AND outside the
  # sliding window (half_map_size around the current pose). Stale in-window
  # voxels are kept — a loop-back trajectory may still need them. This adds
  # the TIME dimension to map_sliding's geometric window; typical products of
  # a drift episode (written once, never re-observed) leave the map.
  # NOTE: stage 2 (periodic re-alignment of submap origins) needs the PGO
  # backend and is intentionally not implemented here.
  submap_enable: false
  submap_period: 50
  submap_evict_stale: 500

  # ---------------------------------------------------------------------------
  # Real IMU preintegration prior (Theorems T2/T3 wiring). When true,
  # LIVMapper builds an IMUPreintegrationPrior from the propagated Δpose and
  # its 6×6 covariance each LIO frame; the prior observation along each
  # degenerate direction is the v_k-projection of [log ΔR ; Δp] and its
  # information is 1/(v_k^T Σ v_k). Replaces the constant default_prior_info
  # floor on the directions the IMU actually constrains (the floor still
  # fills the rest). imu_prior_enable requires enable: true.
  imu_prior_enable: false

  # ---------------------------------------------------------------------------
  # RR-IESKF Axis II (theory.tex sec:gate-optimal / prop:gate-optimal):
  # optimal reliability gate on the VISUAL information block Λ_V. Params live
  # under `vio:` in the base config (vio/gate_enable, vio/gate_C,
  # vio/gate_nu_alpha). The gate is the cost-optimal hyperbola
  #   u* = min(1, 1/(2C b̂² λ_V − η)),   b̂² = max(nu−1, 0) (plug-in read),
  # applied as Λ_V → u² Λ_V before the fused-mask probe and inside the VIO
  # update. At consistency (nu ≤ 1) u = 1: exactly the plain sum, no loss
  # (G1 / rem:route-vs-sum). DOMAIN (prop:common-mode M5): covers
  # per-modality degradation; provably inert to a steady common-mode
  # (extrinsic) bias — see rem:common-meaning for the anchor alternative.
  # No separate switch here; set vio/gate_enable: true in the base config.

  # ---------------------------------------------------------------------------
  # Layer 5 (Theorem T5): cross-modal degeneracy-driven visual patch select.
  # Scores each visual patch by the trace of its pose-information projected
  # onto the LiDAR degenerate projector Π_deg, then greedily selects a budget
  # of top-k patches (submodular, 1-1/e bound). Routes visual information into
  # the directions where LiDAR is weak. Loaded into VIOManager via the
  # vio/* params in the base config (avia.yaml / Outdoor04.yaml).
  # NOTE: the actual switch params live under `vio:` in the base config:
  #   vio/cross_modal_select_enable (bool, default false)
  #   vio/cross_modal_budget       (int,  -1 = use all, >0 = top-k)
  # They are documented here for reference; the base config is the source.

  # ---------------------------------------------------------------------------
  # Layer 8: distance-inflated IMU process noise. Params live under `imu:`
  # in the base config (imu/dist_noise_enable, imu/dist_noise_d_ref). See
  # the base config for their defaults.

  # Optional per-frame probe log file (absolute path recommended). When set
  # AND enable:true, VoxelMapManager appends one line per converged frame:
  #   frame  lambda1..6  m1..6  deg_rank  v_deg_pos(3) v_obs_pos(3)
  # The v_deg_pos / v_obs_pos 3-vectors are the position-block (rows 3..5) of
  # the weakest-degenerate and strongest-observable eigenvectors. They are
  # what eval_ate_by_direction.py projects the ATE translation error onto.
  # Leave empty to disable logging.
  log_file: ""

# -----------------------------------------------------------------------------
# NOTES
# -----------------------------------------------------------------------------
# 1. The mask is computed on the 6×6 LiDAR pose information matrix Λ_L =
#    H^T R^-1 H (assembled at voxel_map.cpp:479). It does NOT touch the VIO /
#    visual residual path — those still run unmodified.
#
# 2. For a real IMU preintegration prior (full B3), set enable:true and wire
#    dd_prior_src_ in LIVMapper.cpp to an IMUPreintegrationPrior built from the
#    ImuProcess Δpose and its covariance. The class is defined in
#    include/degeneracy.h and takes (dpos, drot, imu_delta_cov, info_scale).
#    Until that wiring is done, default_prior_info is the only prior source.
